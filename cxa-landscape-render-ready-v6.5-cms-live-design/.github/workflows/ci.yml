name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  django:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "False"
      DJANGO_PRODUCTION: "True"
      DJANGO_REQUIRE_EXTERNAL_SERVICES: "False"
      DJANGO_ENABLE_HTTPS_SECURITY: "True"
      DJANGO_SECURE_SSL_REDIRECT: "True"
      DJANGO_SECRET_KEY: "ci-only-secret-key-2026-not-used-in-production-0123456789-abcdefghijklmnopqrstuvwxyz"
      DJANGO_ALLOWED_HOSTS: "getsiaq.online,www.getsiaq.online,testserver,localhost"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://getsiaq.online,https://www.getsiaq.online"
      SITE_DOMAIN: "getsiaq.online"
      WWW_SITE_DOMAIN: "www.getsiaq.online"
      SITE_URL: "https://getsiaq.online"
      USE_CLOUDINARY_MEDIA: "False"
      DJANGO_SERVE_MEDIA_FILES: "False"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Build public assets
        run: python scripts/build_public_assets.py
      - name: Run offline audit
        run: python scripts/static_audit.py
      - name: Compile Python
        run: python -m compileall -q core project manage.py scripts/static_audit.py
      - name: Check JavaScript
        run: find static -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django deployment checks
        run: |
          python manage.py check
          python manage.py check --deploy
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Build and verify public catalog
        run: python manage.py ensure_public_catalog
      - name: Run tests
        run: python manage.py test --verbosity 2
      - name: Validate static build
        run: python manage.py collectstatic --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SITE_URL: "https://getsiaq.online"
      DJANGO_API_URL: "https://nakheel-najd.onrender.com"
      DJANGO_API_SECRET: "ci-only-shared-secret"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
